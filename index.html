<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBoxNinja - Amazon Open Box & Used Deals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ninja-graphic {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ninja-head {
            width: 28px;
            height: 28px;
            background: #2d3436;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .ninja-eyes {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .ninja-eye {
            width: 6px;
            height: 2px;
            background: white;
            border-radius: 1px;
        }

        .ninja-mask {
            position: absolute;
            top: 8px;
            left: -2px;
            right: -2px;
            height: 14px;
            background: #667eea;
            border-radius: 2px;
        }

        .ninja-sword {
            position: absolute;
            width: 20px;
            height: 2px;
            background: white;
            top: 8px;
            right: -8px;
            transform: rotate(-45deg);
            border-radius: 1px;
        }

        .ninja-sword::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #dfe6e9;
            right: -1px;
            top: -1px;
            border-radius: 1px;
        }

        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

            width: 100%;
            padding: 14px 45px 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 20px;
        }

        .filters {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, .price-inputs {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover, select:focus {
            border-color: #667eea;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            max-height: 200px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
        }

        .active-filters {
            background: rgba(255,255,255,0.95);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .active-filters.show {
            display: flex;
        }

        .filter-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-tag .remove {
            cursor: pointer;
            font-weight: bold;
            margin-left: 4px;
        }

        .clear-all {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .clear-all:hover {
            background: #ff5252;
        }

        .price-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .price-inputs input {
            width: 90px;
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .price-inputs input:focus {
            outline: none;
            border-color: #667eea;
        }

        .apply-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 18px;
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .sort-section {
            background: rgba(255,255,255,0.95);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            flex-wrap: wrap;
            gap: 15px;
        }

        .sort-controls {

            align-items: center;
            gap: 12px;

        .sort-label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
        }

        .sort-select {

            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            appearance: none;

            background-position: right 12px center;

        .sort-select:hover, .sort-select:focus {
            border-color: #667eea;
            outline: none;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .view-btn {

            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
        }

        .view-btn.active {

            border-color: #667eea;
            color: white;
        }

        .view-btn:hover {

            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-label {
            font-size: 14px;
            color: #666;
        }

            gap: 25px;
            margin-bottom: 30px;
        }

        .products-grid.list-view {
            grid-template-columns: 1fr;
        }

        .product-card.list-view {
            display: flex;

        }

        .product-card.list-view .product-image {

            height: 200px;

        }

        .product-card.list-view .product-info {

        }

            -webkit-line-clamp: 3;
        }

        .product-card.list-view .discount-badge {
            top: 10px;
            right: 10px;
        }

        .product-card.list-view .condition-badge {
            top: 10px;
            left: 10px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .discount-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .condition-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.95);
            color: #764ba2;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            border: 2px solid #764ba2;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-category {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .current-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .original-price {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
        }

        .savings {
            color: #10b981;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .view-deal-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .view-deal-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 18px;
        }

        footer {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 16px;
            text-align: center;

            box-shadow: 0 8px 32px rgba(0,0,0,0.1);

            {
                id: 11,
                title: "iRobot Roomba Robot Vacuum",
                category: "home",

            {
                id: 12,
                title: "Bose SoundLink Revolve+ Bluetooth Speaker",
                category: "electronics",

                discount: 40,
                image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400&h=300&fit=crop",
                savings: 120.00
            }
        ];

        let currentProducts = [...sampleProducts];
        let currentView = 'grid';
        let activeFilters = {
            categories: [],
            conditions: [],
            discount: 0,
            minPrice: 0,
            maxPrice: Infinity,
            search: ''
        };

        function getConditionRank(condition) {
            const ranks = {
                'like-new': 4,
                'very-good': 3,
                'good': 2,
                'acceptable': 1
            };
            return ranks[condition] || 0;
        }

        function applySorting() {
            const sortValue = document.getElementById('sortSelect').value;
            
            switch(sortValue) {
                case 'discount-high':
                    currentProducts.sort((a, b) => b.discount - a.discount);
                    break;
                case 'discount-low':
                    currentProducts.sort((a, b) => a.discount - b.discount);
                    break;
                case 'price-low':
                    currentProducts.sort((a, b) => a.currentPrice - b.currentPrice);
                    break;
                case 'price-high':
                    currentProducts.sort((a, b) => b.currentPrice - a.currentPrice);
                    break;
                case 'savings-high':
                    currentProducts.sort((a, b) => b.savings - a.savings);
                    break;
                case 'savings-low':
                    currentProducts.sort((a, b) => a.savings - b.savings);
                    break;
                case 'condition-best':
                    currentProducts.sort((a, b) => getConditionRank(b.condition) - getConditionRank(a.condition));
                    break;
                case 'relevance':
                    // Default order or could implement relevance scoring
                    currentProducts.sort((a, b) => b.discount - a.discount);
                    break;
            }
            
            renderProducts(currentProducts);
        }

        function setView(view) {
            currentView = view;
            const grid = document.getElementById('productsGrid');
            const gridBtn = document.getElementById('gridViewBtn');
            const listBtn = document.getElementById('listViewBtn');
            
            if (view === 'list') {
                grid.classList.add('list-view');
                listBtn.classList.add('active');
                gridBtn.classList.remove('active');
            } else {
                grid.classList.remove('list-view');
                gridBtn.classList.add('active');
                listBtn.classList.remove('active');
            }
            
            renderProducts(currentProducts);
        }

        function getCheckedValues(prefix) {
            const checkboxes = document.querySelectorAll(`input[id^="${prefix}"]:checked`);
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function updateFilterTags() {
            const filterTags = document.getElementById('filterTags');
            const activeFiltersDiv = document.getElementById('activeFilters');
            let tags = [];

            // Category tags
            activeFilters.categories.forEach(cat => {
                tags.push(`<div class="filter-tag">${formatLabel(cat)} <span class="remove" onclick="removeFilter('category', '${cat}')">×</span></div>`);
            });

            // Condition tags
            activeFilters.conditions.forEach(cond => {
                tags.push(`<div class="filter-tag">${formatLabel(cond)} <span class="remove" onclick="removeFilter('condition', '${cond}')">×</span></div>`);
            });

            // Discount tag
            if (activeFilters.discount > 0) {
                tags.push(`<div class="filter-tag">${activeFilters.discount}%+ Discount <span class="remove" onclick="removeFilter('discount')">×</span></div>`);
            }

            // Price range tag
            if (activeFilters.minPrice > 0 || activeFilters.maxPrice < Infinity) {
                const minStr = activeFilters.minPrice > 0 ? `${activeFilters.minPrice}` : '$0';
                const maxStr = activeFilters.maxPrice < Infinity ? `${activeFilters.maxPrice}` : '∞';
                tags.push(`<div class="filter-tag">${minStr} - ${maxStr} <span class="remove" onclick="removeFilter('price')">×</span></div>`);
            }

            // Search tag
            if (activeFilters.search) {
                tags.push(`<div class="filter-tag">Search: "${activeFilters.search}" <span class="remove" onclick="removeFilter('search')">×</span></div>`);
            }

            filterTags.innerHTML = tags.join('');
            
            if (tags.length > 0) {
                activeFiltersDiv.classList.add('show');
            } else {
                activeFiltersDiv.classList.remove('show');
            }
        }

        function formatLabel(str) {
            return str.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function removeFilter(type, value) {
            switch(type) {
                case 'category':
                    const catCheckbox = document.querySelector(`input[value="${value}"][id^="cat-"]`);
                    if (catCheckbox) catCheckbox.checked = false;
                    break;
                case 'condition':
                    const condCheckbox = document.querySelector(`input[value="${value}"][id^="cond-"]`);
                    if (condCheckbox) condCheckbox.checked = false;
                    break;
                case 'discount':
                    document.getElementById('discountFilter').value = '0';
                    break;
                case 'price':
                    document.getElementById('minPrice').value = '';
                    document.getElementById('maxPrice').value = '';
                    break;
                case 'search':
                    document.getElementById('searchInput').value = '';
                    break;
            }
            applyFilters();
        }

        function clearAllFilters() {
            // Uncheck all checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            
            // Reset other filters
            document.getElementById('discountFilter').value = '0';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('searchInput').value = '';
            
            applyFilters();
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="loading">No products found matching your filters.</div>';
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="product-card" onclick="openAmazon('${product.id}')">
                    <img src="${product.image}" alt="${product.title}" class="product-image">
                    <div class="discount-badge">${product.discount}% OFF</div>
                    <div class="condition-badge">${product.condition.replace('-', ' ').toUpperCase()}</div>
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <h3 class="product-title">${product.title}</h3>
                        <div class="price-section">
                            <span class="current-price">${product.currentPrice.toFixed(2)}</span>
                            <span class="original-price">${product.originalPrice.toFixed(2)}</span>
                        </div>
                        <div class="savings">Save ${product.savings.toFixed(2)}</div>
                        <button class="view-deal-btn">View on Amazon</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('productCount').textContent = products.length;
        }

        function applyFilters() {
            // Get selected categories
            activeFilters.categories = getCheckedValues('cat-');
            
            // Get selected conditions
            activeFilters.conditions = getCheckedValues('cond-');
            
            // Get other filters
            activeFilters.discount = parseInt(document.getElementById('discountFilter').value);
            activeFilters.minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            activeFilters.maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            activeFilters.search = document.getElementById('searchInput').value.toLowerCase();

            // Filter products
            currentProducts = sampleProducts.filter(product => {
                const matchesCategory = activeFilters.categories.length === 0 || 
                                       activeFilters.categories.includes(product.category);
                const matchesCondition = activeFilters.conditions.length === 0 || 
                                        activeFilters.conditions.includes(product.condition);
                const matchesDiscount = product.discount >= activeFilters.discount;
                const matchesPrice = product.currentPrice >= activeFilters.minPrice && 
                                    product.currentPrice <= activeFilters.maxPrice;
                const matchesSearch = activeFilters.search === '' || 
                                     product.title.toLowerCase().includes(activeFilters.search);

                return matchesCategory && matchesCondition && matchesDiscount && 
                       matchesPrice && matchesSearch;
            });

            updateFilterTags();
            renderProducts(currentProducts);
            applySorting(); // Apply sorting after filtering
        }

        function openAmazon(productId) {
            // In a real implementation, this would link to the actual Amazon product
            alert('This would open the Amazon product page. In production, this would use the Amazon Product Advertising API.');
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });

        // Auto-apply on checkbox change
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', applyFilters);
        });

        // Initial render
        renderProducts(currentProducts);
    </script>
